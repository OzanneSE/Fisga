<!DOCTYPE html>

<style>
body{padding:0 0 60px}
header{padding:22px 18px 16px;display:flex;align-items:center;gap:14px;text-align:left}
header .marca{width:26px;height:42px;margin:0}
header .marca line,header .marca path{stroke-width:3}
.logo{font-family:var(--cond);font-weight:300;font-size:30px;letter-spacing:.3em;line-height:1}
.sub{font-family:var(--sans);font-weight:500;font-size:10.5px;letter-spacing:.24em;color:var(--tinta-3);margin-top:6px;text-transform:uppercase}
.volta{white-space:nowrap;margin-left:auto;align-self:flex-start;font-family:var(--sans);font-size:12px;letter-spacing:.12em;color:var(--tinta-3);text-decoration:none;border:1px solid var(--regua);padding:6px 10px;border-radius:2px}
nav{position:sticky;top:0;z-index:5;background:var(--fundo);border-bottom:2px solid var(--fogo)}
.row{display:flex;overflow-x:auto;gap:6px;padding:7px 12px;scrollbar-width:none}
button,.btn{font:600 12.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--regua);background:transparent;color:var(--tinta-2);padding:10px 12px;border-radius:2px;white-space:nowrap;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
nav button[aria-selected=true]{background:var(--fogo);border-color:var(--fogo);color:#F2EDE4}
.row2 button[aria-selected=true]{background:var(--tinta);border-color:var(--tinta);color:var(--fundo)}
main{max-width:640px;margin:0 auto;padding:22px 18px}
.quem{font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.2}
.pr{font-family:var(--sans);font-size:14.5px;line-height:1.5;color:var(--tinta-3);margin:6px 0 14px}
h2{font:600 12.5px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--fogo);margin:30px 0 8px;padding-left:12px;border-left:2px solid var(--fogo)}
h2.fr{color:var(--frio);border-color:var(--frio)}h2.tr{color:var(--tinta-3);border-left-style:dashed;border-color:var(--tinta-3)}
.org{border-left:2px solid var(--regua);padding-left:16px;margin:0 0 6px 6px}
.no{font-family:var(--sans);font-size:15px;padding:6px 0;color:var(--tinta-2)}
.no b{font-family:var(--serif);font-weight:500;font-size:18px;color:var(--tinta);display:block}
.ldr{font-family:var(--serif);font-weight:500;font-size:20px;text-align:center;border:1px solid var(--tinta);padding:12px;margin:8px 0}
.ldr small{display:block;font-family:var(--sans);font-size:13px;color:var(--tinta-3);font-weight:400}
.seta{text-align:center;color:var(--tinta-3);font-family:var(--sans);font-size:13px}
details{border-bottom:1px solid var(--regua);padding:12px 0}
summary{font-family:var(--serif);font-weight:500;font-size:19px;cursor:pointer}
summary small{font-family:var(--sans);font-size:12.5px;color:var(--tinta-3);margin-left:6px;letter-spacing:.04em}
.k{font:600 11px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--tinta-3);margin:12px 0 4px}
ul{list-style:none;font-family:var(--sans);font-size:15px;line-height:1.5;color:var(--tinta-2)}
ul li{padding:3px 0 3px 14px;position:relative}ul li:before{content:"";position:absolute;left:0;top:12px;width:6px;height:1px;background:var(--fogo)}
.it{display:flex;gap:14px;align-items:flex-start;border-bottom:1px solid var(--regua);padding:11px 0;cursor:pointer}
.it input{width:22px;height:22px;flex:0 0 22px;margin-top:2px;accent-color:var(--fogo)}
.it b{font-family:var(--serif);font-weight:500;font-size:17px;line-height:1.3}
.it.ok b{text-decoration:line-through;color:var(--tinta-3)}
.campo{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--regua);font-family:var(--sans);font-size:15px;color:var(--tinta-2)}
input[type=text]{font:16px var(--sans);border:1px solid var(--regua);border-radius:2px;background:transparent;color:var(--tinta);padding:7px 8px;width:60%}
.bar{height:3px;background:var(--regua);margin-top:10px}.bar i{display:block;height:100%;background:var(--fogo)}
.cont{font-family:var(--sans);font-size:12.5px;color:var(--tinta-3);margin-top:6px}
.acoes{display:flex;gap:8px;margin-top:16px}.acoes .btn,.acoes button{flex:1}
.cheio2{background:var(--tinta)!important;color:var(--fundo)!important;border-color:var(--tinta)!important}
.rodape{font-family:var(--sans);font-size:13px;line-height:1.5;color:var(--tinta-3);margin-top:22px}
.prop{font:600 10.5px var(--sans);letter-spacing:.14em;color:var(--fogo);border:1px dashed var(--fogo);padding:0 5px;border-radius:2px;margin-left:6px;vertical-align:3px}
textarea{display:none;font:15px var(--sans);width:100%;min-height:160px;border:1px solid var(--regua);background:transparent;color:var(--tinta);padding:8px;margin-top:10px}
</style></head>
